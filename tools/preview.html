<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拜仁主场 · DSH 插件预览</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font:14px/1.5 "Segoe UI","Microsoft YaHei",sans-serif;background:#f4f5f7;color:#282d35}button,textarea{font:inherit}button{cursor:pointer}.preview-app{height:100vh;grid-template-rows:minmax(0,1fr);display:grid;grid-template-columns:238px minmax(0,1fr)}.preview-sidebar{min-height:0;overflow:auto;background:#eceef1;border-right:1px solid #dfe2e7;padding:24px 16px;display:flex;flex-direction:column;gap:12px}.preview-logo{font-size:21px;font-weight:600;letter-spacing:-.8px;padding:8px 3px 16px}.preview-logo small{font-size:9px;border:1px solid #adb3bd;padding:2px 4px;margin-left:4px;letter-spacing:1px}.preview-new{border:1px solid #d7dbe1;background:#fff;border-radius:9px;padding:10px;color:inherit}.preview-nav{padding:9px 8px;color:#67707d;font-size:13px}.preview-workspace{padding:20px 8px 4px;font-size:11px;color:#7b8490}.preview-session{border-radius:7px;padding:9px 12px;font-size:12px;color:#737b87}.preview-session.selected{background:#fff;color:#282d35}.preview-profile{margin-top:auto;padding:10px 6px;font-size:12px}.preview-note{font-size:10px;color:#9299a2;padding:8px}.preview-note button{color:inherit;border:0;background:transparent;padding:0;text-decoration:underline;font-size:10px}.preview-main{min-height:0;overflow:hidden;position:relative;display:flex;flex-direction:column;min-width:0}.preview-native{position:relative;display:flex;flex-direction:column;flex:1;min-height:0}.preview-host-tools{position:absolute;right:18px;top:18px;display:flex;gap:10px}.preview-host-tools button{width:25px;height:25px;border:1px solid #9aa2b344;background:transparent;border-radius:6px;color:inherit;padding:0;font-size:15px}.preview-topbar{height:66px;padding:20px 28px;color:#808894;font-size:11px;flex-shrink:0}.preview-content{position:relative;display:flex;justify-content:center;align-items:center;flex:1;min-height:0}.preview-welcome{width:min(760px,calc(100% - 80px));margin-top:-50px;position:relative}.preview-greeting{display:flex;justify-content:center;align-items:center;gap:12px;margin-bottom:38px}.preview-greeting h1{font-size:31px;font-weight:500;letter-spacing:-.5px;margin:0}.preview-badge{font-size:9px;color:#949ba5;border:1px solid #c7ccd3;border-radius:4px;padding:2px 6px;margin-left:4px}.preview-context{font-size:12px;color:#8b929d;margin:14px 16px}.preview-input-card{padding:22px 22px 16px;background:var(--bh-surface,#fff);border:1px solid var(--bh-line,#dce0e7);border-radius:18px;box-shadow:0 10px 40px #11182708}.preview-input-card textarea{width:100%;background:transparent;color:var(--bh-text,#222);border:0;outline:0;resize:none;min-height:76px;font-size:14px;line-height:1.6}.preview-input-card textarea::placeholder{color:#9199a5}.preview-input-bottom{display:flex;justify-content:space-between;align-items:center;color:#969eaa;font-size:11px}.preview-send{border:0;background:#dc052d;color:#fff;border-radius:50%;width:36px;height:36px;font-size:23px;box-shadow:0 3px 10px #dc052d24;transition:background 160ms}.preview-bottom-note{text-align:center;font-size:10px;color:#838b97;margin:17px 0 0}.preview-native[data-phase=active] .preview-welcome{margin-top:0}.preview-message{border-radius:12px;background:var(--bh-surface);color:var(--bh-text);padding:20px;margin-bottom:50px;font-size:13px;line-height:1.9}.preview-message[hidden]{display:none}
@media(prefers-color-scheme:dark){html,body{background:#111318;color:#f1f3f5}.preview-sidebar{background:#1b1d22;border-color:#30343d}.preview-logo{color:#f4f5f7}.preview-new{background:#31353e;border-color:#414650}.preview-session.selected{background:#30343c;color:#fff}.preview-nav{color:#b1b7c1}.preview-logo small{border-color:#636b79}.preview-session{color:#949ca9}.preview-badge{border-color:#575f6c;color:#abb2be}}
@media(max-width:850px){.preview-app{grid-template-columns:180px minmax(0,1fr)}.preview-logo{font-size:16px}.preview-logo small{font-size:7px}.preview-welcome{width:calc(100% - 36px)}.preview-greeting h1{font-size:24px}.preview-badge{display:none}}
@media(max-width:600px){.preview-app{display:block}.preview-sidebar{display:none}.preview-main{height:100vh}.preview-welcome{width:calc(100% - 28px)}.preview-greeting h1{font-size:22px}.preview-input-bottom span{font-size:9px}.preview-topbar{padding-left:20px}}
</style><script src="vendor/react.production.min.js"></script><script src="vendor/react-dom.production.min.js"></script></head><body>
<div class="preview-app"><aside class="preview-sidebar"><div class="preview-logo">◈ deepseek <small>HARNESS</small></div><button class="preview-new" id="new-chat">＋ 新会话</button><div class="preview-nav">♧　技能中心</div><div class="preview-nav">◈　插件</div><div class="preview-nav">◷　自动化任务</div><div class="preview-workspace">工作区</div><div class="preview-session">▱ outputs</div><div class="preview-session selected">新会话</div><div class="preview-session">我的拜仁观赛笔记</div><div class="preview-session">周末的灵感清单</div><div class="preview-session">一场关于热爱的对话</div><div class="preview-profile">◉　以终为始</div><div class="preview-note">插件原生客户端预览<br>外观自动跟随系统<br><button id="dispose">停用插件（预览）</button></div></aside>
<main class="preview-main"><div class="preview-native" data-phase="hero"><header class="preview-topbar">DSH / 对话<div class="preview-host-tools"><button type="button" aria-label="宿主工具按钮（预览）">⌘</button><button type="button" aria-label="宿主面板按钮（预览）">◫</button></div></header><div class="preview-content" data-conversation-content data-content-phase="hero"><div class="preview-welcome"><div class="preview-message" hidden id="message"></div><div class="preview-greeting"><span id="crest-slot"></span><h1>探索未至之境<span class="preview-badge">拜仁主场</span></h1></div><div class="preview-context">▱ outputs　⌄　　♧ 标准模式　⌄</div><div id="dock-slot"></div><form id="preview-chat" class="preview-input-card" data-composer-card><textarea id="preview-draft" data-composer-input placeholder="描述你想构建的内容，或者聊聊下一场比赛…" aria-label="DSH 对话输入框"></textarea><div class="preview-input-bottom"><span>＋　　♧ 工作区内修改</span><span>DeepSeek-V4.1-Flash High　⌄　<button class="preview-send" type="submit" aria-label="发送预览消息">↑</button></span></div></form><p class="preview-bottom-note">一份热爱，每次出发。</p></div></div></div><div id="overlay-slot" style="position:absolute;inset:0;pointer-events:none;z-index:20"></div></main></div>
<script>
let previewPlugin, cleanups = [], roots = [];
window.__ModuleLoader__ = {load({factory}) { previewPlugin = factory(name=>{if(name!=='react')throw Error(name);return React;}); }};
</script><script src="../lib/client.js"></script><script>
const input = document.getElementById('preview-draft');
const inputActions = {setDraft:text=>{input.value=text;input.dispatchEvent(new Event('input'));}};
function useInput(selector) { const [draft,setDraft]=React.useState(input.value); React.useEffect(()=>{const fn=()=>setDraft(input.value);input.addEventListener('input',fn);return()=>input.removeEventListener('input',fn);},[]); return selector({draft}); }
const ctx = {effect(fn){const clean=fn();if(typeof clean==='function')cleanups.push(clean);},slots:{inject(name,fn){fn();},register(spec,Component){const targets={'shell.overlay':'overlay-slot','conversation.hero.brand.mark':'crest-slot','conversation.input.dock':'dock-slot'};if(!targets[spec.name])throw Error('Unexpected slot '+spec.name);const root=ReactDOM.createRoot(document.getElementById(targets[spec.name]));roots.push(root);root.render(React.createElement(Component,{size:38,useInput,inputActions}));}}};
previewPlugin.apply(ctx);
window.disposePreviewPlugin = ()=>{for(const root of roots)root.unmount();for(const fn of cleanups.reverse())fn();roots=[];cleanups=[];};
document.getElementById('dispose').onclick=window.disposePreviewPlugin;
document.getElementById('new-chat').onclick=()=>{input.value='';document.querySelector('.preview-native').dataset.phase='hero';document.querySelector('[data-conversation-content]').dataset.contentPhase='hero';document.getElementById('message').hidden=true;document.querySelector('.preview-greeting').hidden=false;};
document.getElementById('preview-chat').onsubmit=e=>{e.preventDefault();if(!input.value.trim())return;document.querySelector('.preview-native').dataset.phase='active';document.querySelector('[data-conversation-content]').dataset.contentPhase='active';const box=document.getElementById('message');box.hidden=false;box.textContent='你：'+input.value+'\n\n这是界面预览。安装到 DSH 后，对话由你的模型处理。';document.querySelector('.preview-greeting').hidden=true;input.value='';input.dispatchEvent(new Event('input'));};
</script></body></html>
